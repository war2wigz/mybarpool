[package]
name = "mybarpool"
version = "0.1.0"
description = "MyBarPool: NFL boxes on Solana. The on-chain program."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mybarpool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }

[dev-dependencies]
mollusk-svm = { workspace = true }
mollusk-svm-bencher = { workspace = true }
# The Solana crate majors Mollusk 0.15.1 exposes in its public API.
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
# Mollusk 0.15.1 was built against Agave 4.2.0's runtime crates, whose
# `agave-unstable-api` surface changed in 4.3.0 (cargo would otherwise pick
# 4.3.0 and Mollusk no longer compiles). The runtime crates `=`-depend on each
# other, so pinning this one pins the set. Not a program dependency: the SBF
# build never sees it.
solana-program-runtime = "=4.2.0"

[[bench]]
name = "compute_units"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
