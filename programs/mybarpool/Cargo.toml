[package]
name = "mybarpool"
version = "0.1.0"
description = "MyBarPool: NFL boxes on Solana. The on-chain program."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mybarpool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Dev-only: Mollusk writes a fuzz fixture per `process_instruction` call when
# `EJECT_FUZZ_FIXTURES=<dir>` is set (build plan Step 8). Never on in `anchor build`;
# the fixture crate's build script needs `protoc`, which only the fuzz CI job installs.
fuzz-fixtures = ["mollusk-svm/fuzz"]

[dependencies]
# event-cpi: events are self-CPIs (PROGRAM §7), never truncated out of the logs.
# init-if-needed: set_wallet_override "creates or updates" (PROGRAM §4.1).
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
# token_interface::Mint and the Token-2022 extension reader (PROGRAM §5.4); associated_token
# for the idempotent ATA create that settlement pays SPL prizes through (Step 6). The feature
# makes `spl-associated-token-account-interface` (already in the lockfile through the Mollusk
# token loaders) part of the compiled program's tree; nothing else new.
anchor-spl = { workspace = true, features = ["token", "token_2022", "associated_token"] }
# PROGRAM §6.1 `sha256` (the hashv syscall) and the SlotHashes sysvar id.
# anchor-lang 1.2.0's `solana_program` facade re-exports neither, and both
# crates are already in its own tree at these versions, so nothing new is
# resolved: the two lines only make the dependency direct.
solana-sha256-hasher = "3.1"
solana-sdk-ids = "3.1"
# PROGRAM §4.4: Entropy's formulas are keccak-256 (`sol_keccak256` on-chain through this
# crate's `hashv`; `sha3` on the host so the fixtures compute the same values). The one
# runtime crate Step 5 adds to the compiled program tree; its `sha3` 0.10 was already there.
solana-keccak-hasher = { version = "3.1", features = ["sha3"] }

[dev-dependencies]
mollusk-svm = { workspace = true, features = ["inner-instructions"] }
mollusk-svm-bencher = { workspace = true }
# Loads the Token and Token-2022 programs into Mollusk for the SPL pool tests (Step 4).
mollusk-svm-programs-token = "=0.16.0"
# Reads the shared vector files (packages/shared/src/vectors/*.json) in the cross-language tests.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The Solana crate majors Mollusk 0.16.0 exposes in its public API.
solana-account = "4.3"
solana-hash = "4.7"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
# Fixtures: the ProgramData account is a bincode-serialised UpgradeableLoaderState.
# The loader-v3 line names the 6.x that `anchor_lang::solana_program::
# bpf_loader_upgradeable` re-exports, only to switch its `serde` feature on;
# Mollusk's own 7.x is a separate crate. The Token / Token-2022 mint fixtures
# use the SPL interface crates anchor-spl re-exports, so no line here.
bincode = "1.3"
solana-loader-v3-interface = { version = "6.1", features = ["serde"] }

[[bench]]
name = "compute_units"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(dylint_lib, values(any()))'] }
