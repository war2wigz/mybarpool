[package]
name = "mybarpool"
version = "0.1.0"
description = "MyBarPool: NFL boxes on Solana. The on-chain program."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mybarpool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# event-cpi: events are self-CPIs (PROGRAM §7), never truncated out of the logs.
# init-if-needed: set_wallet_override "creates or updates" (PROGRAM §4.1).
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
# token_interface::Mint and the Token-2022 extension reader (PROGRAM §5.4).
anchor-spl = { workspace = true, features = ["token", "token_2022"] }

[dev-dependencies]
mollusk-svm = { workspace = true, features = ["inner-instructions"] }
mollusk-svm-bencher = { workspace = true }
# The Solana crate majors Mollusk 0.15.1 exposes in its public API.
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
# Fixtures: the ProgramData account (bincode-serialised UpgradeableLoaderState)
# and Token / Token-2022 mints with extensions, at the versions anchor-lang 1.2
# and anchor-spl 1.2 already resolve.
bincode = "1.3"
solana-loader-v3-interface = { version = "6.1", features = ["serde"] }
spl-token-interface = "3.0"
spl-token-2022-interface = "3.1"
# Mollusk 0.15.1 was built against Agave 4.2.0's runtime crates, whose
# `agave-unstable-api` surface changed in 4.3.0 (cargo would otherwise pick
# 4.3.0 and Mollusk no longer compiles). The runtime crates `=`-depend on each
# other, so pinning this one pins the set. Not a program dependency: the SBF
# build never sees it.
solana-program-runtime = "=4.2.0"

[[bench]]
name = "compute_units"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(dylint_lib, values(any()))'] }
