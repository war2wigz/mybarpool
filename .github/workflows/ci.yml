name: CI

# Program and SDK tests on every push and pull request (build plan Step 0).
# Four jobs, each one a gate:
#   program  — `anchor build --arch v3`, the SBPFv3 header check, Mollusk
#              unit tests, the compute-unit table (diff shown, never a failure),
#              and the Surfpool localnet suite forking mainnet.
#   sdk      — packages/shared build, tests and typecheck; the lockfile must
#              carry exactly one @solana/kit major and no @solana/web3.js.
#   entropy-fork-hash — rebuilds the platform's Entropy deployment
#              (war2wigz/entropy at ENTROPY_FORK_COMMIT) with solana-verify and
#              fails unless the bytes equal the committed fixture the Mollusk
#              and Surfpool suites run (Step 5b).
#   fuzz     — ejects a Mollusk fixture from every unit-test instruction and
#              replays and mutates them for a fixed budget under the PROGRAM
#              §10 Money oracle (fuzz/, build plan Step 8); `protoc` is this
#              job's only extra tool (the fixture crate's build script).
#   lints    — OtterSec anchor-lints via cargo dylint, cargo audit (lints.yml).
# Pinned versions come from rust-toolchain.toml, Anchor.toml and package.json.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SOLANA_VERSION: "4.3.0"
  ANCHOR_VERSION: "1.2.0"
  SURFPOOL_VERSION: "1.6.0"
  # The fork commit the Entropy fixture was built from; the same value is in
  # tests/helpers/entropy.ts (ENTROPY_FORK_COMMIT) and names the fixture file.
  ENTROPY_FORK_COMMIT: "486225b288e70aeda37e1179c673ab02254587d2"
  SOLANA_VERIFY_VERSION: "0.5.2"
  # The image solana-verify 0.5.2 maps to Agave 4.3.0 (see verifiable-build.yml).
  VERIFY_BASE_IMAGE: solanafoundation/solana-verifiable-build@sha256:12fd4c0a0790f0fc41ef74b0cdb6bccc167ba6137eb1adb749bac649481c86bd

jobs:
  program:
    name: Program (build v3, Mollusk, Surfpool)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (rust-toolchain.toml)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain

      - name: Install Solana ${{ env.SOLANA_VERSION }}, Anchor ${{ env.ANCHOR_VERSION }}, Surfpool ${{ env.SURFPOOL_VERSION }}
        # Every download is checked against the sha256 recorded here (the
        # digests of the release assets on 2026-10-03). A replaced asset fails
        # the build instead of silently changing the toolchain.
        env:
          AGAVE_INSTALL_INIT_SHA256: 1c2ca01cd33204453fa97762b6fca40772e17e749d58266ea0847d7bc01756e1
          ANCHOR_SHA256: 0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7
          SURFPOOL_SHA256: cb471b00aa3b7d603338eb74ebfec1d23959ecba005b5f1be42ba8d174107fc2
        run: |
          set -euo pipefail
          mkdir -p /tmp/toolchain && cd /tmp/toolchain
          curl -sSfL -o agave-install-init \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/agave-install-init-x86_64-unknown-linux-gnu"
          curl -sSfL -o anchor \
            "https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL -o surfpool.tar.gz \
            "https://github.com/solana-foundation/surfpool/releases/download/v${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          printf '%s  agave-install-init\n%s  anchor\n%s  surfpool.tar.gz\n' \
            "$AGAVE_INSTALL_INIT_SHA256" "$ANCHOR_SHA256" "$SURFPOOL_SHA256" | sha256sum -c -
          chmod +x agave-install-init && ./agave-install-init "v${SOLANA_VERSION}"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          install -m 755 anchor "$HOME/.cargo/bin/anchor"
          tar -xzf surfpool.tar.gz
          install -m 755 "$(find . -name surfpool -type f | head -1)" "$HOME/.cargo/bin/surfpool"

      - name: Versions
        run: |
          rustc --version && cargo --version
          solana --version && cargo-build-sbf --version
          anchor --version && surfpool --version && node --version

      - name: Local wallet for the test provider
        run: solana-keygen new --no-bip39-passphrase --silent -o "$HOME/.config/solana/id.json"

      - name: Program keypair and declared id
        # The program keypair is never committed. CI generates one and syncs
        # declare_id!/Anchor.toml to it so the deployed id matches the binary.
        run: |
          set -euo pipefail
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent -o target/deploy/mybarpool-keypair.json
          anchor keys sync
          grep -n 'mybarpool = ' Anchor.toml

      - name: anchor build --arch v3
        run: anchor build --arch v3

      - name: SBPFv3 header check
        # An unflagged ELF is v0 and a bug (ARCHITECTURE › Toolchain).
        run: |
          set -euo pipefail
          readelf -h target/deploy/mybarpool.so | tee /dev/stderr | grep -q 'Flags:\s*0x3'

      - name: Committed IDL matches the build
        # This job synced the id to a fresh keypair, so the two IDLs differ
        # exactly where the program id appears: `address`, and any 32-byte
        # `const` the id was baked into (the `program_data` PDA seed in
        # `initialize` is `crate::ID`). Each file has those replaced by a
        # placeholder against its own `address`, then they must be identical.
        run: |
          set -euo pipefail
          normalise() {
            IDL_PATH="$IDL" python3 - <<'PY'
          import json, os, sys
          idl = json.load(open(os.environ["IDL_PATH"]))
          # base58 decode without a dependency (a 32-byte address has no leading-zero bytes to lose).
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          n = 0
          for c in idl["address"]:
              n = n * 58 + ALPHABET.index(c)
          id_bytes = list(n.to_bytes(32, "big"))
          def walk(o):
              if isinstance(o, dict):
                  if o.get("kind") == "const" and o.get("value") == id_bytes:
                      o["value"] = "<program id>"
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(idl)
          idl["address"] = "<program id>"
          json.dump(idl, sys.stdout, indent=2, sort_keys=False)
          PY
          }
          diff <(IDL=target/idl/mybarpool.json normalise) <(IDL=idl/mybarpool.json normalise)

      - name: Mollusk unit tests
        run: cargo test -p mybarpool --locked

      - name: Compute-unit table
        # Regenerated every run; a changed row is a review item, not a failure.
        run: |
          set -euo pipefail
          cargo bench -p mybarpool --locked
          git --no-pager diff --stat -- programs/mybarpool/compute_units.md || true
          git --no-pager diff -- programs/mybarpool/compute_units.md || true

      - name: npm ci
        run: npm ci

      - name: Build packages/shared (the localnet suite imports its dist/)
        run: npm run build

      - name: Dedicated RPC for the mainnet fork, when configured
        # Surfpool forks mainnet through `[surfpool] datasource_rpc_url` in
        # Anchor.toml, the public endpoint by default. From a shared runner the
        # public endpoint rate-limits the first touch of fresh accounts (Step 3
        # audit M1), so when the repository secret SURFPOOL_RPC_URL is set the
        # one line is rewritten to it; without the secret this step does nothing
        # and forks keep the public endpoint. The URL is never echoed.
        if: env.SURFPOOL_RPC_URL != ''
        env:
          SURFPOOL_RPC_URL: ${{ secrets.SURFPOOL_RPC_URL }}
        run: |
          set -euo pipefail
          sed -i "s|^datasource_rpc_url = .*|datasource_rpc_url = \"${SURFPOOL_RPC_URL}\"|" Anchor.toml
          grep -c '^datasource_rpc_url = ' Anchor.toml

      - name: Localnet suite (Surfpool, mainnet fork)
        # The suite reads the program id from the synced Anchor.toml, so it
        # asserts whatever id CI generated is deployed and executable.
        run: anchor test --skip-build

      - name: Surfpool logs on failure
        if: failure()
        run: tail -n 200 .surfpool/logs/*.log || true

  fuzz:
    name: Fuzz (Mollusk fixtures, proptest, §10 oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain

      - name: Install Solana ${{ env.SOLANA_VERSION }}, Anchor ${{ env.ANCHOR_VERSION }}, Surfpool ${{ env.SURFPOOL_VERSION }}
        # Every download is checked against the sha256 recorded here (the
        # digests of the release assets on 2026-10-03). A replaced asset fails
        # the build instead of silently changing the toolchain.
        env:
          AGAVE_INSTALL_INIT_SHA256: 1c2ca01cd33204453fa97762b6fca40772e17e749d58266ea0847d7bc01756e1
          ANCHOR_SHA256: 0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7
          SURFPOOL_SHA256: cb471b00aa3b7d603338eb74ebfec1d23959ecba005b5f1be42ba8d174107fc2
        run: |
          set -euo pipefail
          mkdir -p /tmp/toolchain && cd /tmp/toolchain
          curl -sSfL -o agave-install-init \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/agave-install-init-x86_64-unknown-linux-gnu"
          curl -sSfL -o anchor \
            "https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL -o surfpool.tar.gz \
            "https://github.com/solana-foundation/surfpool/releases/download/v${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          printf '%s  agave-install-init\n%s  anchor\n%s  surfpool.tar.gz\n' \
            "$AGAVE_INSTALL_INIT_SHA256" "$ANCHOR_SHA256" "$SURFPOOL_SHA256" | sha256sum -c -
          chmod +x agave-install-init && ./agave-install-init "v${SOLANA_VERSION}"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          install -m 755 anchor "$HOME/.cargo/bin/anchor"
          tar -xzf surfpool.tar.gz
          install -m 755 "$(find . -name surfpool -type f | head -1)" "$HOME/.cargo/bin/surfpool"

      - name: protoc (the fixture crate's build script; this job's only extra tool)
        run: sudo apt-get install -y protobuf-compiler && protoc --version

      - name: Local wallet for the test provider
        run: solana-keygen new --no-bip39-passphrase --silent -o "$HOME/.config/solana/id.json"

      - name: Program keypair and declared id
        # The program keypair is never committed. CI generates one and syncs
        # declare_id!/Anchor.toml to it so the deployed id matches the binary.
        run: |
          set -euo pipefail
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent -o target/deploy/mybarpool-keypair.json
          anchor keys sync
          grep -n 'mybarpool = ' Anchor.toml

      - name: anchor build --arch v3
        run: anchor build --arch v3

      - name: Eject a fixture from every unit-test instruction
        # One file per `process_instruction` call (about 770); a relative path would resolve
        # against the package directory, so the absolute one is passed.
        run: |
          set -euo pipefail
          EJECT_FUZZ_FIXTURES="$PWD/target/fuzz-fixtures" cargo test -p mybarpool --locked --features fuzz-fixtures
          ls target/fuzz-fixtures | wc -l

      - name: Replay every seed, then fuzz for 600 seconds
        # Prints the proptest seed it used; `--seed <n>` reproduces a run. A violation is a
        # bug or a harness bug; both are red.
        run: |
          set -euo pipefail
          RUST_LOG=error cargo run -p mybarpool-fuzz --release --locked --features runner -- \
            --fixtures target/fuzz-fixtures --filter all --seconds 600

  sdk:
    name: SDK (packages/shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: One Kit major, no web3.js (ARCHITECTURE › Clients)
        run: |
          set -euo pipefail
          if grep -q '"node_modules/@solana/web3.js"' package-lock.json; then
            echo "@solana/web3.js is in the lockfile"; exit 1
          fi
          majors=$(node -e 'const l=require("./package-lock.json");const s=new Set();for(const [k,v] of Object.entries(l.packages)){if(k.endsWith("node_modules/@solana/kit"))s.add(v.version.split(".")[0])}console.log([...s].join(" "))')
          echo "@solana/kit majors: $majors"
          test "$(echo "$majors" | wc -w)" = "1"

      - name: Generated client regenerated from the committed IDL, diff must be empty
        # `src/generated/` is rendered from idl/mybarpool.json by codama.mjs and committed; a
        # hand edit, a stale render or a renderer drift shows here.
        run: |
          set -euo pipefail
          npm run generate --workspace packages/shared
          git diff --exit-code -- packages/shared/src/generated

      - run: npm run build
      - name: Tests with coverage thresholds (100% branches on fees and winner)
        run: npm run test:coverage --workspace packages/shared
      - run: npm run typecheck
      - run: npm run format

      - name: No endpoint in the bundle (the SDK ships with no RPC endpoint)
        # The SDK ships with no default RPC endpoint and forms no platform URL. The only URL
        # literals allowed in dist/ are Codama's attribution comment and the dApp Store scheme.
        run: |
          set -euo pipefail
          found=$(grep -rhoE '[a-z][a-z0-9+.-]*://[^ "`)]*' packages/shared/dist \
            | grep -vE '^https://github.com/codama-idl/codama$|^solanadappstore://' || true)
          if [ -n "$found" ]; then
            echo "URL literals in dist/:"; echo "$found"; exit 1
          fi

      - name: No Node-only globals in the SDK source (it runs in the browser and on the phone)
        # `types: []` does not keep `@types/node` out (a transitive reference pulls it in), so a
        # `Buffer` or `process` use type-checks and then fails at runtime off Node. The
        # generated client's `process.env.NODE_ENV` guard is the bundler's to inline, as Kit's own is.
        run: |
          set -euo pipefail
          if grep -rnE '\bBuffer\b|\bprocess\.' packages/shared/src --include='*.ts' --exclude-dir=generated; then
            echo "Node-only global in packages/shared/src"; exit 1
          fi

      - name: API reference builds with every export documented (typedoc, warnings as errors)
        run: npm run docs --workspace packages/shared

      - name: Package contents (npm pack --dry-run)
        # dist/**, src/vectors/*.json, README.md, LICENSE, package.json and nothing else.
        run: |
          set -euo pipefail
          npm pack --dry-run --workspace packages/shared 2>&1 | tee pack.log
          if grep -E '^npm notice [0-9.]+ ?[kMB]*B? +' pack.log | grep -vE ' (dist/|src/vectors/|README\.md|LICENSE|package\.json)'; then
            echo "unexpected file in the package"; exit 1
          fi

  entropy-fork-hash:
    name: Entropy fork rebuilt equals the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: war2wigz/entropy
          ref: ${{ env.ENTROPY_FORK_COMMIT }}
          path: entropy-fork
          persist-credentials: false

      - name: Install Rust (host, for solana-verify)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install solana-verify ${{ env.SOLANA_VERIFY_VERSION }}
        # From this checkout, whose rust-toolchain.toml is new enough; the
        # fork's pins the host to 1.85.0, which solana-verify's dependencies refuse.
        run: cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked

      - name: solana-verify build --arch v3 (the fork)
        # The same command the fork's own CI runs; the program is built inside
        # the Docker image, so the fork's host toolchain pin does not apply.
        run: solana-verify build --arch v3 --library-name entropy_program --base-image "$VERIFY_BASE_IMAGE"
        working-directory: entropy-fork

      - name: The rebuilt bytes equal the committed fixture
        # Byte equality first. If the two ever differ only by trailing zero
        # padding, compare executable hashes instead and record it in the step
        # notes; so far the outputs have been identical.
        run: |
          set -euo pipefail
          fixture="programs/mybarpool/tests/fixtures/entropy-${ENTROPY_FORK_COMMIT:0:7}.so"
          built="entropy-fork/target/deploy/entropy_program.so"
          readelf -h "$built" | grep -q 'Flags:\s*0x3'
          sha256sum "$fixture" "$built"
          solana-verify get-executable-hash "$built"
          cmp "$fixture" "$built"
