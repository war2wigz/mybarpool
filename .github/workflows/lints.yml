name: Lints

# OtterSec anchor-lints through cargo dylint (ARCHITECTURE › Toolchain).
# Required job: the 14 lint crates at the pinned commit build on
# nightly-2025-09-18 and lint anchor-lang 1.2.0 code (proven in the Step 0
# audit), so a warning here fails the build. The three rules PROGRAM §10
# writes out (missing_account_reload, arbitrary_cpi_call,
# overconstrained_seed_account) are among them.
#
# cargo-audit (build plan Step 8): `cargo audit --deny warnings` against the
# RustSec database, with `.cargo/audit.toml` ignoring exactly the recorded
# transitive `unmaintained` advisories (each with its path and owner). A fifth
# warning, or any vulnerability, fails the build; the database moves daily.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DYLINT_NIGHTLY: nightly-2025-09-18
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  anchor-lints:
    name: cargo dylint (anchor-lints)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust with the lint nightly
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$DYLINT_NIGHTLY" --profile minimal -c llvm-tools -c rustc-dev

      - name: Install cargo-dylint and dylint-link
        run: cargo install cargo-dylint dylint-link --locked

      - name: cargo dylint --all
        # Libraries come from [workspace.metadata.dylint] in Cargo.toml,
        # pinned to a commit of otter-sec/anchor-lints. Warnings are errors.
        run: cargo dylint --all --workspace -- --lib
        env:
          DYLINT_RUSTFLAGS: -D warnings

  cargo-audit:
    name: cargo audit --deny warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain

      - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      - name: cargo audit --deny warnings
        # The ignore list and its reasons live in .cargo/audit.toml.
        run: cargo audit --deny warnings
