name: Lints

# OtterSec anchor-lints through cargo dylint (ARCHITECTURE › Toolchain).
# The lint crate pins nightly-2025-09-18 and tests against an Anchor fork;
# Step 0 has not yet proven it compiles against Anchor 1.2.0 code, so this job
# reports (continue-on-error) rather than gates. Once it is green on the real
# program it becomes required (build plan Step 0, audit caveat); until then
# the three rules that matter here (missing_account_reload,
# arbitrary_cpi_call, overconstrained_seed_account) are checked by the auditor
# by hand against PROGRAM §10.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DYLINT_NIGHTLY: nightly-2025-09-18

jobs:
  anchor-lints:
    name: cargo dylint (anchor-lints)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust with the lint nightly
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$DYLINT_NIGHTLY" --profile minimal -c llvm-tools -c rustc-dev

      - name: Install cargo-dylint and dylint-link
        run: cargo install cargo-dylint dylint-link --locked

      - name: cargo dylint --all
        # Libraries come from [workspace.metadata.dylint] in Cargo.toml,
        # pinned to a commit of otter-sec/anchor-lints.
        run: cargo dylint --all --workspace -- --lib
