# `cargo audit --deny warnings` in the Lints workflow (build plan Step 8). Every id below is
# an advisory on a transitive dependency none of this repository's crates names directly;
# each is the upstream owner's to replace. Four are `unmaintained`; the fifth is a
# vulnerability in a dev-only crate that reaches no built program and has no patched
# version on its dependency path. A sixth warning, or any vulnerability on a path that
# reaches the compiled program, fails the build. Re-check the list whenever a pin moves.
[advisories]
ignore = [
    # bincode 1.3.3 (RUSTSEC-2025-0141, unmaintained): anchor-lang 1.2.0 → bincode. Anchor's.
    "RUSTSEC-2025-0141",
    # derivative 2.2.0 (RUSTSEC-2024-0388, unmaintained): solana-syscalls 4.3.0 → solana-poseidon
    # → light-poseidon → ark-bn254 → ark-ec → derivative. Agave's (dev-side here, via Mollusk).
    "RUSTSEC-2024-0388",
    # paste 1.0.15 (RUSTSEC-2024-0436, unmaintained): the same ark-* path, through ark-ff.
    "RUSTSEC-2024-0436",
    # libsecp256k1 0.7.2 (RUSTSEC-2025-0161, unmaintained): solana-syscalls 4.3.0 →
    # libsecp256k1. Agave's (dev-side here, via Mollusk).
    "RUSTSEC-2025-0161",
    # crypto-bigint 0.5.5 (RUSTSEC-2026-0387, published 2026-10-24: timing variability in
    # operations meant to be constant-time; patched in 0.7.6): solana-syscalls 4.3.0 →
    # solana-secp256k1-recover → k256 0.13 → ecdsa → elliptic-curve 0.13 → crypto-bigint 0.5,
    # Agave's, dev-side only (Mollusk and the bencher; `cargo tree -e normal -i crypto-bigint`
    # is empty, so nothing in the deployed program or the Entropy fork contains it). k256 0.13
    # pins the 0.5 line, so no `cargo update` reaches 0.7.6; the test harness holds no secret
    # integers for the side channel to leak. Drop the ignore when Agave moves to k256 0.14.
    "RUSTSEC-2026-0387",
]
